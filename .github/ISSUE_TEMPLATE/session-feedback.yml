name: Session feedback
description: Tell us what happened at your table.
title: "[Session] "
labels: [playtest]
body:
  - type: textarea
    id: context
    attributes:
      label: Session context
      description: Edition, adventure, number of explorers, builds, and approximate session length. Omit personal information.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened and how did it feel?
      description: What was exciting, boring, confusing, or unfair? Include a concrete moment.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What would you change?
