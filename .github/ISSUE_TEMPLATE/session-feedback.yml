name: Session feedback
description: Tell us what happened at your table.
title: "[Session] "
labels: [playtest]
body:
  - type: markdown
    attributes:
      value: |
        **This report will be public and requires a GitHub account.**
        Share game details only. Do not include player names, email addresses, contact details, private chat logs, or personal information about anyone at your table.
        A brief report or a session that ended early is useful. No response time is promised.
  - type: textarea
    id: context
    attributes:
      label: Session context
      description: Edition, adventure, number of explorers, builds, and approximate session length. Omit personal information.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened and how did it feel?
      description: What was exciting, boring, confusing, or unfair? Include a concrete moment without identifying players.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What would you change?
