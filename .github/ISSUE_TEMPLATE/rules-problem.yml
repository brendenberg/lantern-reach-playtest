name: Rules problem
description: Report an unclear rule, contradiction, or exploit.
title: "[Rules] "
labels: [rules]
body:
  - type: markdown
    attributes:
      value: |
        **This report will be public and requires a GitHub account.**
        Share rules and game situations only. Do not include player names, contact details, private chat logs, or other personal information. No response time is promised.
  - type: input
    id: location
    attributes:
      label: Edition, book, and page
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: Include the situation, the rule you used, and the outcome. Distinguish actual play from a hypothetical example.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
